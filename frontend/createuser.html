<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./create.css" />
    <script src="./app.js" defer></script>
    <title>Create User</title>
  </head>
  <body>
    <div class="links">
      <a href="./members.html">Memberships</a>
      <a href="./users.html">Users</a>
    </div>
    <div class="createuser-container">
      <h2>Create User</h2>
      <div class="createuser-form">
        <form id="form-container">
          <div class="form-row">
            <div class="user-form-group">
              <label for="firstname">First Name <span>*</span></label>
              <input
                type="text"
                id="firstname"
                placeholder="First Name"
                required
              />
            </div>
            <div class="user-form-group">
              <label for="lastname">Last Name <span>*</span></label>
              <input
                type="text"
                id="lastname"
                placeholder="Last Name"
                required
              />
            </div>
          </div>
          <div class="user-form-group">
            <label for="email">Email Address <span>*</span></label>
            <input
              type="text"
              id="email"
              placeholder="Email Address"
              required
            />
          </div>
          <div class="user-form-group">
            <label for="changing">Change Membership</label>
            <select name="changing" id="changing">
              <option value="Trial">Trial</option>
              <option value="Silver">Silver</option>
              <option value="Bronze">Bronze</option>
              <option value="Gold">Gold</option>
              <option value="Platinum">Platinum</option>
            </select>
          </div>
          <div class="form-buttons">
            <button type="button" class="cancel-btn user-btn">Cancel</button>
            <button type="submit" class="submit-btn">New User</button>
          </div>
        </form>
      </div>
    </div>
    <footer class="user-footer">
      Copyright &copy; 2021 Membership Manager
    </footer>
  </body>
</html>
