<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./create.css" />
    <script src="./app.js" defer></script>
    <title>Create Membership</title>
  </head>
  <body>
    <div class="links">
      <a href="./members.html">Memberships</a>
      <a href="./users.html">Users</a>
    </div>
    <div class="createmember-container">
      <h2>Create Membership</h2>
      <div class="create-form">
        <form>
          <div class="form-data">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" placeholder="Name" required />
            </div>
            <div class="form-group">
              <label for="membership">Membership Price</label>
              <div class="price-input">
                <input
                  type="text"
                  id="membership"
                  placeholder="Membership Price"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label for="description">Description</label>
              <textarea id="description" placeholder="Description"></textarea>
            </div>

            <div class="form-buttons">
              <button type="button" class="cancel-btn">Cancel</button>
              <button type="submit" class="submit-btn">New Membership</button>
            </div>
          </div>
        </form>
      </div>
    </div>
    <footer>Copyright &copy; 2021 Membership Manager</footer>
  </body>
</html>
